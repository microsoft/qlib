name: Test qlib from source slow

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    timeout-minutes: 720
    env:
      MLFLOW_ALLOW_FILE_STORE: "true"
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci/constraints.txt
    # we may retry for 3 times for `Unit tests with Pytest`

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-22.04, macos-14, macos-15]
        # In github action, using python 3.7, pip install will not match the latest version of the package.
        # Also, python 3.7 is no longer supported from macos-14, and will be phased out from macos-13 in the near future.
        # All things considered, we have removed python 3.7.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Test qlib from source slow
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # The cp38/cp39 universal2 wheels contain x86_64-only WHEEL tags.
    # Build locally so the binary and metadata both match this runner.
    - name: Configure grpcio source builds on older macOS ARM64 Python
      if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' && (matrix.python-version == '3.8' || matrix.python-version == '3.9') }}
      shell: bash
      run: |
        echo "PIP_NO_BINARY=grpcio" >> "$GITHUB_ENV"
        echo "GRPC_PYTHON_BUILD_EXT_COMPILER_JOBS=2" >> "$GITHUB_ENV"

    - name: Set up Python tools
      run: |
        make dev

    - name: Verify grpcio native extension on older macOS ARM64 Python
      if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' && (matrix.python-version == '3.8' || matrix.python-version == '3.9') }}
      run: python -c "import grpc; from grpc._cython import cygrpc; print('grpcio', grpc.__version__, cygrpc.__file__)"

    - name: Verify dependency consistency
      run: python -m pip check

    - name: Verify native solvers on Windows Python 3.8
      if: ${{ matrix.os == 'windows-latest' && matrix.python-version == '3.8' }}
      run: python -c "import cvxpy, osqp; print('CVXPY', cvxpy.__version__, 'OSQP', osqp.__version__)"

    - name: Downloads dependencies data
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 15
        max_attempts: 3
        retry_wait_seconds: 10
        shell: bash
        command: python scripts/get_data.py qlib_data --name qlib_data_simple --target_dir ~/.qlib/qlib_data/cn_data --interval 1d --region cn --delete_old False

    - name: Install Lightgbm for MacOS
      if: ${{ matrix.os == 'macos-14' || matrix.os == 'macos-15' }}
      run: |
        brew update
        brew install libomp || brew reinstall libomp
        python -m pip install --no-binary=:all: lightgbm

    - name: Unit tests with Pytest
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 240
        max_attempts: 3
        command: |
          cd tests
          python -m pytest . -m "slow" --durations=0

    - name: Report installed dependencies
      if: always()
      run: python -m pip freeze
